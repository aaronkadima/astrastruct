name: AstraStruct CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-and-solver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and validate modules
        run: npm run check
      - name: Run structural solver tests
        run: npm test
      - name: Validate persistent IFC application exchange
        run: node tests/ifc-exchange-ui-v045-smoke.mjs
      - name: Build React/Vite application
        env:
          ASTRA_BASE_PATH: ${{ github.ref == 'refs/heads/develop' && '/astrastruct/dev/' || '/astrastruct/' }}
        run: npm run build

  ifc-external-validation:
    if: github.ref == 'refs/heads/develop'
    needs: app-and-solver-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install IfcOpenShell validation dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir ifcopenshell==0.8.5 pytest==8.4.2
      - name: Generate deterministic IFC4X3 validation fixture
        run: node scripts/generate-ifc-v045-validation-fixture.mjs artifacts/ifc/astrastruct-v045-validation.ifc
      - name: Validate STEP physical file syntax
        run: python -m ifcopenshell.simple_spf artifacts/ifc/astrastruct-v045-validation.ifc
      - name: Validate IFC4X3 schema and EXPRESS rules
        run: python scripts/validate-ifc-v045-ifcopenshell.py artifacts/ifc/astrastruct-v045-validation.ifc

  development-browser-regression:
    if: github.ref == 'refs/heads/develop'
    needs: app-and-solver-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build development application
        env:
          ASTRA_BASE_PATH: /astrastruct/dev/
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop, Android and tablet regression
        env:
          ASTRA_BASE_PATH: /astrastruct/dev/
        run: npm run test:e2e