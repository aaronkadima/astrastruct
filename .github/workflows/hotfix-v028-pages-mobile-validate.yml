name: v028 Pages mobile hotfix validation

on:
  push:
    branches: [fix/v028-pages-mobile-e2e]
    paths:
      - tests/e2e/buckling3d-v027.spec.ts
      - tests/e2e/modal3d-v027.spec.ts
      - .github/workflows/hotfix-v028-pages-mobile-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v028-pages-mobile-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and validate modules
        run: npm run check
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate responsive 3D flows
        run: npx playwright test tests/e2e/buckling3d-v027.spec.ts tests/e2e/modal3d-v027.spec.ts
