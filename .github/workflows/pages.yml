name: Deploy AstraStruct production and development

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["AstraStruct CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astrastruct-pages
  cancel-in-progress: false

jobs:
  assemble-site:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and build production
        working-directory: production
        env:
          ASTRA_BASE_PATH: /astrastruct/
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
          node tests/pages-artifact-smoke.mjs

      - name: Validate and build development
        working-directory: development
        env:
          ASTRA_BASE_PATH: /astrastruct/dev/
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
          grep -q '/astrastruct/dev/assets/' dist/index.html

      - name: Assemble production and development pages
        run: |
          rm -rf site
          mkdir -p site/dev
          cp -a production/dist/. site/
          cp -a development/dist/. site/dev/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: assemble-site
    environment:
      name: github-pages
      url: https://aaronkadima.github.io/astrastruct/
    runs-on: ubuntu-latest
    steps:
      - name: Deploy combined site
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for a concurrent native Pages deployment
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 25

      - name: Retry combined site deployment
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Confirm deployment channels
        run: echo "Production=/astrastruct/ Development=/astrastruct/dev/"
