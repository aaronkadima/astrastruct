name: Deploy AstraStruct to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and validate engine modules
        run: npm run check
      - name: Run structural solver tests
        run: npm test
      - name: Build React/Vite application
        run: npm run build
      - name: Validate GitHub Pages artifact
        run: node tests/pages-artifact-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built application
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-regression:
    needs: build-and-test
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application for browser tests
        run: npm run build
      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - name: Run desktop, Android and tablet regression
        run: npm run test:e2e
