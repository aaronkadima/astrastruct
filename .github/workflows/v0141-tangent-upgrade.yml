name: AstraStruct v0.14.1 tangent upgrade

on:
  push:
    branches: [feat/v0141-tangent-hinges]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0141-tangent-hinges
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply affine tangent kernel patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('web/src/solver/corotational2d.js')
          s=p.read_text()
          replacements=[
          ("""function connectionStiffnesses(releases={},rotationalSprings={}){\n  return[endRotationalStiffness(releases,rotationalSprings,1),endRotationalStiffness(releases,rotationalSprings,2)];\n}\n\nfunction condenseTangent""",
           """function connectionStiffnesses(releases={},rotationalSprings={}){\n  return[endRotationalStiffness(releases,rotationalSprings,1),endRotationalStiffness(releases,rotationalSprings,2)];\n}\n\nfunction connectionMomentOffsets(rotationalSpringMoments={}){\n  const value=key=>{const raw=rotationalSpringMoments?.[key];return Number.isFinite(Number(raw))?Number(raw):0};\n  return[value('rz1'),value('rz2')];\n}\n\nfunction condenseTangent"""),
          ("""export function corotationalConnectedElementState({X1,Y1,X2,Y2,qGlobal,E,A,I,initialBasic=[0,0,0],pGlobal=[0,0,0,0,0,0],loadFactor=1,releases={},rotationalSprings={}}){\n  const qNode=qGlobal.map(Number),p=pGlobal.map(Number),lambda=Number(loadFactor),kEnds=connectionStiffnesses(releases,rotationalSprings),flex=[0,1].filter(i=>Number.isFinite(kEnds[i]));""",
           """export function corotationalConnectedElementState({X1,Y1,X2,Y2,qGlobal,E,A,I,initialBasic=[0,0,0],pGlobal=[0,0,0,0,0,0],loadFactor=1,releases={},rotationalSprings={},rotationalSpringMoments={}}){\n  const qNode=qGlobal.map(Number),p=pGlobal.map(Number),lambda=Number(loadFactor),kEnds=connectionStiffnesses(releases,rotationalSprings),mEnds=connectionMomentOffsets(rotationalSpringMoments),flex=[0,1].filter(i=>Number.isFinite(kEnds[i]));"""),
          ("""    const thermalChord=Kb[i][0]*d0[0]+Kb[i][1]*d0[1],fixed=rigid.reduce((sum,j)=>sum+Kb[i][j]*beta[j],0),k=kEnds[i],theta=qNode[rotDofs[i]],pMoment=lambda*p[rotDofs[i]];\n    return pMoment+k*theta+thermalChord-fixed;""",
           """    const thermalChord=Kb[i][0]*d0[0]+Kb[i][1]*d0[1],fixed=rigid.reduce((sum,j)=>sum+Kb[i][j]*beta[j],0),k=kEnds[i],theta=qNode[rotDofs[i]],pMoment=lambda*p[rotDofs[i]],offsetMoment=mEnds[i];\n    return pMoment+k*theta+offsetMoment+thermalChord-fixed;"""),
          ("""    const dof=rotDofs[end],k=kEnds[end],relativeRotation=qNode[dof]-beta[end],springMoment=k*relativeRotation,elementMoment=beamGradient[dof],residual=elementMoment-springMoment;\n    gradient[dof]+=springMoment;internalConnectionResidual=Math.max(internalConnectionResidual,Math.abs(residual));\n    connectionRotations.push({dof,end:end+1,k,nodeRotation:qNode[dof],elementRotation:beta[end],relativeRotation,moment:elementMoment,springMoment,residual,type:k===0?'release':'semirigid'});""",
           """    const dof=rotDofs[end],k=kEnds[end],offsetMoment=mEnds[end],relativeRotation=qNode[dof]-beta[end],springMoment=k*relativeRotation+offsetMoment,elementMoment=beamGradient[dof],residual=elementMoment-springMoment;\n    gradient[dof]+=springMoment;internalConnectionResidual=Math.max(internalConnectionResidual,Math.abs(residual));\n    connectionRotations.push({dof,end:end+1,k,offsetMoment,nodeRotation:qNode[dof],elementRotation:beta[end],relativeRotation,moment:elementMoment,springMoment,residual,type:k===0?'release':'semirigid'});"""),
          ("""  return{state,qElement,gradient,tangent,connectionRotations,internalConnectionResidual,stiffnesses:kEnds};""",
           """  return{state,qElement,gradient,tangent,connectionRotations,internalConnectionResidual,stiffnesses:kEnds,momentOffsets:mEnds};"""),
          ("""const connected=corotationalConnectedElementState({X1:Number(item.a.x),Y1:Number(item.a.y),X2:Number(item.b.x),Y2:Number(item.b.y),qGlobal:qNode,E:item.E,A:item.A,I:item.I,initialBasic,pGlobal:item.pGlobal,loadFactor,releases:item.e.releases||{},rotationalSprings:item.e.rotationalSprings||{}}),state=connected.state;""",
           """const connected=corotationalConnectedElementState({X1:Number(item.a.x),Y1:Number(item.a.y),X2:Number(item.b.x),Y2:Number(item.b.y),qGlobal:qNode,E:item.E,A:item.A,I:item.I,initialBasic,pGlobal:item.pGlobal,loadFactor,releases:item.e.releases||{},rotationalSprings:item.e.rotationalSprings||{},rotationalSpringMoments:item.e.rotationalSpringMoments||{}}),state=connected.state;""")]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('kernel patch anchor not found: '+old[:100])
              s=s.replace(old,new,1)
          marker=""" * condensation. Releases são o limite k=0 e rigidez infinita representa ligação rígida.\n */"""
          if marker in s:
              s=s.replace(marker,""" * condensation. Releases são o limite k=0 e rigidez infinita representa ligação rígida.\n * rotationalSpringMoments contém o termo constante M0 da lei afim\n * M = k(theta_n-theta_e) + M0; M0 não altera a Hessiana condensada.\n */""",1)
          p.write_text(s)

          p=Path('tests/material-global-smoke.mjs')
          s=p.read_text().replace("r.solverVersion==='0.14.0-exp'","r.solverVersion==='0.14.1-exp'",1)
          anchor="""  assert(r.materialNonlinearity?.enabled,'v0.14 global: metadado de não linearidade material ausente');\n"""
          if anchor not in s: raise SystemExit('material smoke anchor not found')
          s=s.replace(anchor,anchor+"""  assert(r.materialNonlinearity.linearization==='tangent','v0.14.1 global: linearização tangente não foi ativada');\n  assert(String(r.materialNonlinearity.globalStrategy||'').includes('affine'),'v0.14.1 global: estratégia afim não registrada');\n""",1)
          anchor2="""  assert(rec.yieldedFibers>0,'v0.14 global: benchmark deveria plastificar fibras');\n"""
          s=s.replace(anchor2,anchor2+"""  assert(Number.isFinite(rec.appliedStiffness)&&rec.appliedStiffness>0,'v0.14.1 global: rigidez tangente aplicada inválida');\n  assert(Number.isFinite(rec.appliedOffsetMoment),'v0.14.1 global: termo afim M0 ausente');\n""",1)
          p.write_text(s)

          p=Path('tests/e2e/material-nonlinear.spec.ts')
          s=p.read_text().replace("0.14.0-exp","0.14.1-exp")
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and validate modules
        run: npm run check
      - name: Run structural solver tests
        run: npm test
      - name: Build React/Vite application
        run: npm run build
      - name: Commit validated upgrade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/solver/corotational2d.js tests/material-global-smoke.mjs tests/e2e/material-nonlinear.spec.ts
          git commit -m "feat: condense affine tangent fiber hinges" || exit 0
          git push origin HEAD:feat/v0141-tangent-hinges
