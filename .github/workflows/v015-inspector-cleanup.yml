name: AstraStruct v0.15 inspector cleanup

on:
  push:
    branches: [feat/v015-embedded-material-newton]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v015-embedded-material-newton
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align Inspector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/InspectorPanel.tsx');s=p.read_text()
          s=s.replace("fiberFamilyEligible=['rect','i','h','ih','rhs'].includes(sectionFamily)","fiberFamilyEligible=['rect','rectangle','retangular','i','h','ih','i/h','wide-flange','wideflange','rhs','box','hss-rect','hss_rect','tube-rect'].includes(sectionFamily)",1)
          s=s.replace('<h4>Rótulas de fibras · v0.14.2</h4>','<h4>Rótulas de fibras · v0.15</h4>',1)
          s=s.replace('Modelo monotônico bilinear com equilíbrio N–M; não representa resposta cíclica.','Modelo monotônico bilinear com equilíbrio N–M e Newton constitutivo embutido; não representa resposta cíclica.',1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check && npm run build
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/InspectorPanel.tsx
          git commit -m "chore: align Inspector with v0.15 material solver" || exit 0
          git push origin HEAD:feat/v015-embedded-material-newton
