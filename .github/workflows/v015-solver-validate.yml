name: AstraStruct v0.15 solver validate

on:
  push:
    branches: [feat/v015-embedded-material-newton]

permissions:
  contents: write

jobs:
  solver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v015-embedded-material-newton
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wire embedded constitutive resolver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('web/src/solver/corotational2d.js')
          s=p.read_text()
          s=s.replace('function assemble(prepared,u,loadFactor=1){','function assemble(prepared,u,loadFactor=1,options={}){',1)
          old="""    const connected=corotationalConnectedElementState({X1:Number(item.a.x),Y1:Number(item.a.y),X2:Number(item.b.x),Y2:Number(item.b.y),qGlobal:qNode,E:item.E,A:item.A,I:item.I,initialBasic,pGlobal:item.pGlobal,loadFactor,releases:item.e.releases||{},rotationalSprings:item.e.rotationalSprings||{},rotationalSpringMoments:item.e.rotationalSpringMoments||{}}),state=connected.state;"""
          new="""    const connectionArgs={X1:Number(item.a.x),Y1:Number(item.a.y),X2:Number(item.b.x),Y2:Number(item.b.y),qGlobal:qNode,E:item.E,A:item.A,I:item.I,initialBasic,pGlobal:item.pGlobal,loadFactor,releases:item.e.releases||{},rotationalSprings:item.e.rotationalSprings||{},rotationalSpringMoments:item.e.rotationalSpringMoments||{}};\n    const connected=typeof options.connectionResolver==='function'?options.connectionResolver({item,qNode,initialBasic,loadFactor,connectionArgs,solveConnected:(overrides={})=>corotationalConnectedElementState({...connectionArgs,...overrides})}):corotationalConnectedElementState(connectionArgs),state=connected?.state;\n    if(!state||!Array.isArray(connected?.gradient)||!Array.isArray(connected?.tangent))throw new Error(`Co-rotacional: resolvedor de ligação retornou estado inválido em ${item.e.id}.`);"""
          if old not in s: raise SystemExit('assemble connection anchor missing')
          s=s.replace(old,new,1)
          old="""function residualAt(prepared,u,loadFactor){\n  const assembled=assemble(prepared,u,loadFactor),external=prepared.F.map((v,i)=>loadFactor*(v+assembled.follower[i])),residual=external.map((v,i)=>v-assembled.fint[i]),K=addMatrix(assembled.Kint,assembled.Kext,-loadFactor);"""
          new="""function residualAt(prepared,u,loadFactor,options={}){\n  const assembled=assemble(prepared,u,loadFactor,options),external=prepared.F.map((v,i)=>loadFactor*(v+assembled.follower[i])),residual=external.map((v,i)=>v-assembled.fint[i]),K=addMatrix(assembled.Kint,assembled.Kext,-loadFactor);"""
          if old not in s: raise SystemExit('residual anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('residualAt(prepared,u,lambda)', 'residualAt(prepared,u,lambda,options)')
          s=s.replace('residualAt(prepared,trial,lambda)', 'residualAt(prepared,trial,lambda,options)')
          s=s.replace('residualAt(prepared,u,1)', 'residualAt(prepared,u,1,options)')
          old='    history.push({step,loadFactor:lambda,iterations:iteration,residualNorm:last.norm});'
          new="""    const materialLocalIterations=Math.max(0,...(last.states||[]).map(x=>Number(x.connected?.materialLocalIterations)||0));\n    history.push({step,loadFactor:lambda,iterations:iteration,residualNorm:last.norm,materialLocalIterations});"""
          if old not in s: raise SystemExit('history anchor missing')
          s=s.replace(old,new,1)
          old="connectionCondensation:{internalResidual:connected.internalConnectionResidual,stiffnesses:connected.stiffnesses}"
          new="connectionCondensation:{internalResidual:connected.internalConnectionResidual,stiffnesses:connected.stiffnesses,materialLocalIterations:Number(connected.materialLocalIterations)||0,materialResidual:Number(connected.materialResidual)||0,materialMeta:connected.materialConnectionMeta||null}"
          if old not in s: raise SystemExit('connection metadata anchor missing')
          s=s.replace(old,new,1)
          old="endConnections:{flexibleEndCount,method:'internal end rotations + Schur condensation',experimental:true}"
          new="endConnections:{flexibleEndCount,method:'internal end rotations + Schur condensation',customResolver:typeof options.connectionResolver==='function',experimental:true}"
          if old not in s: raise SystemExit('endConnections anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('web/src/solver/index.js')
          s=p.read_text()
          old='materialMaxIterations:s.materialMaxIterations,materialTolerance:s.materialTolerance,materialRelaxation:s.materialRelaxation'
          new='materialMaxIterations:s.materialMaxIterations,materialTolerance:s.materialTolerance,materialRelaxation:s.materialRelaxation,materialCoupling:s.materialCoupling'
          if old not in s: raise SystemExit('dispatcher options anchor missing')
          s=s.replace(old,new,1).replace('Rótulas de fibras v0.14 exigem','Rótulas de fibras v0.15 exigem',1)
          p.write_text(s)

          p=Path('tests/material-global-smoke.mjs')
          s=p.read_text()
          s=s.replace("r.solverVersion==='0.14.2-exp'","r.solverVersion==='0.15.0-exp'",1)
          s=s.replace("assert(r.materialNonlinearity.linearization==='tangent','v0.14.2 global: linearização tangente não foi ativada');","assert(String(r.materialNonlinearity.linearization||'').includes('tangent-affine'),'v0.15 global: linearização tangente-afim não foi ativada');",1)
          s=s.replace("assert(String(r.materialNonlinearity.globalStrategy||'').includes('affine'),'v0.14.2 global: estratégia afim não registrada');","assert(String(r.materialNonlinearity.globalStrategy||'').includes('embedded'),'v0.15 global: estratégia material embutida não registrada');",1)
          s=s.replace("assert(r.materialNonlinearity.outerIterations>=2,'v0.14 global: iteração constitutiva externa não executada');","assert(r.materialNonlinearity.coupling==='embedded-local-newton','v0.15 global: acoplamento material embutido não ativado');assert(r.materialNonlinearity.outerIterations===0,'v0.15 global: não deveria existir iteração material global externa');assert(r.materialNonlinearity.maxLocalIterations>=2,'v0.15 global: Newton constitutivo local não foi executado');",1)
          s=s.replace("console.log('v0.14.2 — rótula retangular global em flexão OK'","console.log('v0.15 — rótula retangular global em flexão OK'",1)
          marker="console.log('Todos os smoke tests globais de rótula de fibras do AstraStruct v0.14.2 passaram.');"
          if marker not in s: raise SystemExit('global test final marker missing')
          regression="""// 4) Regressão embedded vs modo externo legado.\n{\n  const pEmbedded=steelCantilever({axial:-600,moment:1900}),rEmbedded=solve(pEmbedded,'LC1'),pOuter=steelCantilever({axial:-600,moment:1900});\n  pOuter.settings.materialCoupling='outer';\n  const rOuter=solve(pOuter,'LC1'),a=rEmbedded.materialNonlinearity.records[0],b=rOuter.materialNonlinearity.records[0],uA=rEmbedded.displacements.find(x=>x.nodeId==='N2'),uB=rOuter.displacements.find(x=>x.nodeId==='N2');\n  near(a.constitutiveMoment,b.constitutiveMoment,Math.max(.2,Math.abs(a.constitutiveMoment)*8e-4),'v0.15 regressão: momento embedded vs outer');\n  near(a.rotation,b.rotation,Math.max(2e-6,Math.abs(a.rotation)*2e-3),'v0.15 regressão: rotação embedded vs outer');\n  near(uA.rz,uB.rz,Math.max(2e-6,Math.abs(uA.rz)*2e-3),'v0.15 regressão: rotação nodal embedded vs outer');\n  assert(rOuter.materialNonlinearity.coupling==='outer-compatibility','v0.15 regressão: fallback externo não identificado');\n  console.log('v0.15 — embedded vs outer OK','M=',a.constitutiveMoment,'theta=',a.rotation,'local=',rEmbedded.materialNonlinearity.maxLocalIterations,'outer=',rOuter.materialNonlinearity.outerIterations);\n}\n\nconsole.log('Todos os smoke tests globais de rótula de fibras do AstraStruct v0.15 passaram.');"""
          s=s.replace(marker,regression,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated solver
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/solver/corotational2d.js web/src/solver/index.js tests/material-global-smoke.mjs
          git commit -m "feat: embed fiber hinge Newton in global equilibrium" || exit 0
          git push origin HEAD:feat/v015-embedded-material-newton
