name: AstraStruct v0.16 displacement-control core

on:
  push:
    branches: [feat/v016-displacement-control-pushover]

permissions:
  contents: write

jobs:
  core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v016-displacement-control-pushover
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Implement displacement-control pushover core
        run: |
          python tools/v016_core_patch.py
          python tools/v016_regression_patch.py
          python tools/v016_bordered_fix.py
          python tools/v016_tolerance_floor.py
          python tools/v016_diagnostic_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated core
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/solver/corotational2d.js web/src/solver/materialNonlinear2d.js web/src/solver/index.js web/src/core/model.js web/src/solver/corotationalPostprocess.js tests/material-global-smoke.mjs tests/pushover-smoke.mjs package.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: add displacement-control pushover core"
            git push origin HEAD:feat/v016-displacement-control-pushover
          fi