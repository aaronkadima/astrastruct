name: AstraStruct v0.16 pushover UI

on:
  push:
    branches: [feat/v016-displacement-control-pushover]

permissions:
  contents: write

jobs:
  ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v016-displacement-control-pushover
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.16 UI/report updates
        run: |
          python tools/v016_ui_patch.py
          python tools/v016_report_patch.py
          python tools/v016_e2e_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v0.16 browser regressions
        run: npx playwright test tests/e2e/material-nonlinear.spec.ts tests/e2e/pushover.spec.ts --project=desktop-chromium
      - name: Commit validated UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/AnalysisPanelV13.tsx app/src/NonlinearPostprocessPanel.tsx app/src/NonlinearReportPanel.tsx app/src/InspectorPanel.tsx README.md tests/e2e/material-nonlinear.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add pushover controls and capacity postprocess"
            git push origin HEAD:feat/v016-displacement-control-pushover
          fi