name: AstraStruct v0.17 arc-length core

on:
  push:
    branches: [feat/v017-arc-length-riks]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
