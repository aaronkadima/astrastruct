name: AstraStruct v0.17 arc-length UI final validation

on:
  push:
    branches: [feat/v017-arc-length-riks]

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.17 UI patch
        run: |
          sed -i 's/Modelo concentrado v0.15:/Modelo concentrado v0.16:/' tools/v017_ui_patch.py
          python tools/v017_ui_patch.py
          sed -i 's/Não linearidade material v0.16/Não linearidade material v0.17/' tests/e2e/material-nonlinear.spec.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v0.17 browser regressions
        run: npx playwright test tests/e2e/arc-length.spec.ts tests/e2e/pushover.spec.ts tests/e2e/material-nonlinear.spec.ts --project=desktop-chromium
      - name: Commit validated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/AnalysisPanelV13.tsx app/src/NonlinearPostprocessPanel.tsx app/src/NonlinearReportPanel.tsx tests/e2e/arc-length.spec.ts tests/e2e/material-nonlinear.spec.ts README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add arc-length controls and equilibrium-path postprocess"
          git push
