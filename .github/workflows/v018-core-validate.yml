name: AstraStruct v0.18 stability core

on:
  push:
    branches: [feat/v018-stability-bifurcation]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.18 patch once
        run: |
          if grep -q 'function tangentStabilityState' web/src/solver/corotational2d.js; then
            echo 'v0.18 core already applied'
          else
            python tools/v018_patch.py
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/solver/corotational2d.js'); t=p.read_text()
          old="const mode=modeGeneralized.map((v,i)=>v/scales[i]),im=modeGeneralized.reduce((best,_,i)=>Math.abs(modeGeneralized[i])>Math.abs(modeGeneralized[best])?i:best,0),globalDof=prepared.free[im],nodeIndex=Math.floor(globalDof/3),dof=['ux','uy','rz'][globalDof%3];"
          new="const mode=modeGeneralized.map((v,i)=>v/scales[i]),translationCandidates=prepared.free.map((d,i)=>({d,i})).filter(x=>x.d%3!==2),pool=translationCandidates.length?translationCandidates:prepared.free.map((d,i)=>({d,i})),pick=pool.reduce((best,x)=>Math.abs(modeGeneralized[x.i])>Math.abs(modeGeneralized[best.i])?x:best,pool[0]),im=pick.i,globalDof=prepared.free[im],nodeIndex=Math.floor(globalDof/3),dof=['ux','uy','rz'][globalDof%3];"
          if old in t:
              t=t.replace(old,new,1)
          elif 'translationCandidates=prepared.free.map' not in t:
              raise SystemExit('critical-mode descriptor anchor missing')

          old="    const uBase=[...u],lambdaBase=lambda,branchRequest=pendingBranchSwitch;let accepted=false,lastError=null,iteration=0,cutbacksUsed=0,usedRadius=radius,branchPerturbationUsed=null;"
          new="    const uBase=[...u],lambdaBase=lambda,branchRequest=pendingBranchSwitch;let branchMode=null,branchTarget=0;if(branchRequest){branchMode=[...(branchRequest.mode||[])];const mn=Math.sqrt(Math.max(0,arcDot(branchMode,branchMode,weights)));if(mn>1e-14)branchMode=branchMode.map(v=>v/mn);branchTarget=branchSwitchSign*branchSwitchAmplitude*radius}let accepted=false,lastError=null,iteration=0,cutbacksUsed=0,usedRadius=radius,branchPerturbationUsed=null;"
          if old in t:t=t.replace(old,new,1)
          elif 'let branchMode=null,branchTarget=0' not in t:raise SystemExit('branch seed initialization anchor missing')

          old="          const duStep=prepared.free.map((d,k)=>u[d]-uBase[d]),dLambdaStep=lambda-lambdaBase,g=arcConstraint(duStep,dLambdaStep,weights,alpha,radius),scale=residualScale(prepared,last,lambda),gTol=Math.max(constraintTolerance*radius*radius,1e-14);"
          new="          const duStep=prepared.free.map((d,k)=>u[d]-uBase[d]),dLambdaStep=lambda-lambdaBase,modalProjection=branchRequest?arcDot(duStep,branchMode,weights):null,g=branchRequest?modalProjection-branchTarget:arcConstraint(duStep,dLambdaStep,weights,alpha,radius),scale=residualScale(prepared,last,lambda),gTol=branchRequest?Math.max(constraintTolerance*Math.max(Math.abs(branchTarget),radius*1e-3),1e-12):Math.max(constraintTolerance*radius*radius,1e-14);"
          if old in t:t=t.replace(old,new,1)
          elif 'modalProjection=branchRequest?arcDot' not in t:raise SystemExit('branch seed iteration constraint anchor missing')

          old="          const Kff=prepared.free.map(i=>prepared.free.map(j=>last.K[i][j])),rf=prepared.free.map(i=>last.residual[i]),dRdl=residualLoadDerivative(prepared,u,lambda,options),pf=prepared.free.map(i=>dRdl[i]),nf=prepared.free.length,augmented=Kff.map((row,i)=>[...row,-pf[i]]),constraintRow=[...duStep.map((v,i)=>2*weights[i]*v),2*alpha*alpha*dLambdaStep];augmented.push(constraintRow);"
          new="          const Kff=prepared.free.map(i=>prepared.free.map(j=>last.K[i][j])),rf=prepared.free.map(i=>last.residual[i]),dRdl=residualLoadDerivative(prepared,u,lambda,options),pf=prepared.free.map(i=>dRdl[i]),nf=prepared.free.length,augmented=Kff.map((row,i)=>[...row,-pf[i]]),constraintRow=branchRequest?[...branchMode.map((v,i)=>weights[i]*v),0]:[...duStep.map((v,i)=>2*weights[i]*v),2*alpha*alpha*dLambdaStep];augmented.push(constraintRow);"
          if old in t:t=t.replace(old,new,1)
          elif 'constraintRow=branchRequest?' not in t:raise SystemExit('branch seed bordered row anchor missing')

          old="          const currentMerit=arcMerit(prepared,last,g,lambda,radius);let eta=1,next=null;"
          new="          const currentMerit=branchRequest?Math.hypot(last.norm/residualScale(prepared,last,lambda),Math.abs(g)/Math.max(Math.abs(branchTarget),1e-12)):arcMerit(prepared,last,g,lambda,radius);let eta=1,next=null;"
          if old in t:t=t.replace(old,new,1)
          elif 'const currentMerit=branchRequest?' not in t:raise SystemExit('branch seed merit anchor missing')

          old="          if(lineSearch){for(let ls=0;ls<8;ls++){const trial=addFreeIncrement(prepared,u,duCorr,eta),trialLambda=lambda+eta*dlCorr,candidate=residualAt(prepared,trial,trialLambda,options),duTrial=prepared.free.map(d=>trial[d]-uBase[d]),gTrial=arcConstraint(duTrial,trialLambda-lambdaBase,weights,alpha,radius),merit=arcMerit(prepared,candidate,gTrial,trialLambda,radius);if(merit<currentMerit||eta<=1/128){next={trial,trialLambda,candidate};break}eta*=.5}}"
          new="          if(lineSearch){for(let ls=0;ls<8;ls++){const trial=addFreeIncrement(prepared,u,duCorr,eta),trialLambda=lambda+eta*dlCorr,candidate=residualAt(prepared,trial,trialLambda,options),duTrial=prepared.free.map(d=>trial[d]-uBase[d]),gTrial=branchRequest?arcDot(duTrial,branchMode,weights)-branchTarget:arcConstraint(duTrial,trialLambda-lambdaBase,weights,alpha,radius),merit=branchRequest?Math.hypot(candidate.norm/residualScale(prepared,candidate,trialLambda),Math.abs(gTrial)/Math.max(Math.abs(branchTarget),1e-12)):arcMerit(prepared,candidate,gTrial,trialLambda,radius);if(merit<currentMerit||eta<=1/128){next={trial,trialLambda,candidate};break}eta*=.5}}"
          if old in t:t=t.replace(old,new,1)
          elif 'gTrial=branchRequest?arcDot' not in t:raise SystemExit('branch seed line-search anchor missing')

          old="        if(!converged){const duStep=prepared.free.map(d=>u[d]-uBase[d]),g=arcConstraint(duStep,lambda-lambdaBase,weights,alpha,radius),scale=residualScale(prepared,last,lambda),gTol=Math.max(constraintTolerance*radius*radius,1e-14);if(last.norm<=Math.max(tolerance*scale,absoluteTolerance)&&Math.abs(g)<=gTol)converged=true}"
          new="        if(!converged){const duStep=prepared.free.map(d=>u[d]-uBase[d]),g=branchRequest?arcDot(duStep,branchMode,weights)-branchTarget:arcConstraint(duStep,lambda-lambdaBase,weights,alpha,radius),scale=residualScale(prepared,last,lambda),gTol=branchRequest?Math.max(constraintTolerance*Math.max(Math.abs(branchTarget),radius*1e-3),1e-12):Math.max(constraintTolerance*radius*radius,1e-14);if(last.norm<=Math.max(tolerance*scale,absoluteTolerance)&&Math.abs(g)<=gTol)converged=true}"
          if old in t:t=t.replace(old,new,1)
          elif 'g=branchRequest?arcDot(duStep,branchMode,weights)-branchTarget' not in t:raise SystemExit('branch seed final convergence anchor missing')

          old="history.push({step,loadFactor:lambda,monitoredDisplacement:u[monitor.index],baseReaction:baseReactionAt(prepared,last,monitor.dof),iterations:iteration,residualNorm:last.norm,arcConstraint:arcConstraint(stepDu,stepDl,weights,alpha,usedRadius),arcRadius:usedRadius,arcNorm:stepNorm,loadIncrement:stepDl,cutbacks:cutbacksUsed,materialLocalIterations,yieldedHingeCount:yielded.length,yieldedHinges:yielded,newlyYieldedHinges:newlyYielded,criticalEigenvalue:stabilityState?.enabled?stabilityState.eigenvalue:null"
          new="history.push({step,loadFactor:lambda,monitoredDisplacement:u[monitor.index],baseReaction:baseReactionAt(prepared,last,monitor.dof),iterations:iteration,residualNorm:last.norm,arcConstraint:branchRequest?null:arcConstraint(stepDu,stepDl,weights,alpha,usedRadius),continuationConstraint:branchRequest?'critical-mode-seed':'arc-length',modalConstraintResidual:branchRequest?arcDot(stepDu,branchMode,weights)-branchTarget:null,arcRadius:usedRadius,arcNorm:stepNorm,loadIncrement:stepDl,cutbacks:cutbacksUsed,materialLocalIterations,yieldedHingeCount:yielded.length,yieldedHinges:yielded,newlyYieldedHinges:newlyYielded,criticalEigenvalue:stabilityState?.enabled?stabilityState.eigenvalue:null"
          if old in t:t=t.replace(old,new,1)
          elif "continuationConstraint:branchRequest?'critical-mode-seed':'arc-length'" not in t:raise SystemExit('branch seed history anchor missing')

          t=t.replace("method:'critical-mode orthogonal predictor perturbation'","method:'critical-mode one-step modal-amplitude constraint + arc-length continuation'",1)
          p.write_text(t)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated v0.18 core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/solver/corotational2d.js web/src/solver/index.js web/src/solver/materialNonlinear2d.js web/src/core/model.js tests/arc-length-smoke.mjs tests/stability-bifurcation-smoke.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add tangent singularity and bifurcation diagnostics"
          git push
