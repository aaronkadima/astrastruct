name: Finalize AstraStruct v0.18 README

on:
  push:
    branches: [feat/v018-stability-bifurcation]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README and remove this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          t=t.replace('> **v0.18 experimental:** Arc-Length/Riks esférico de Crisfield com raio adaptativo, cutback, detecção de pontos-limite e integração ao solver co-rotacional/material.', '> **v0.18 experimental:** estabilidade tangente sobre Arc-Length/Riks, detecção espectral de singularidades, classificação de ponto-limite/bifurcação candidata e troca de ramo modal opcional.', 1)
          t=t.replace('> **Estado atual — v0.17.0 experimental:**', '> **Estado atual — v0.18.0 experimental:**', 1)
          anchor='- **pushover por controle de deslocamento v0.16, com fator de carga λ como incógnita, curva capacidade λ–u, rastreamento da sequência de plastificação e recuperação do estado final no fator de carga convergido**;'
          extra='\n- **Arc-Length/Riks esférico v0.18, com raio adaptativo, cutback, continuidade de ramo e travessia de pontos-limite**;\n- **estabilidade tangente v0.18, com autovalor crítico da parte simétrica escalada, classificação de ponto-limite/bifurcação candidata e semeadura modal experimental de ramo; para tangentes não simétricas o resultado é apenas candidato a singularidade não conservativa**;'
          if 'estabilidade tangente v0.18' not in t:
              if anchor not in t: raise SystemExit('README feature anchor missing')
              t=t.replace(anchor,anchor+extra,1)
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v018-readme-finalize.yml
          git add README.md
          git commit -m "docs: finalize v0.18 README and clean temporary workflow"
          git push
