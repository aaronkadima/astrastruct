name: AstraStruct v0.19 multimode stability core

on:
  push:
    branches: [feat/v019-multimode-branch-exploration]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.19 patches once
        run: |
          if grep -q "0.19.0-exp" web/src/solver/corotational2d.js; then
            echo 'v0.19 core already applied'
          else
            python tools/v019_patch.py
          fi
          if grep -q 'stabilityModeCount: 4' web/src/core/model.js; then
            echo 'v0.19 settings already applied'
          else
            python tools/v019_settings_patch.py
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated v0.19 core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/solver/corotational2d.js web/src/solver/stabilityMultimode2d.js web/src/solver/index.js web/src/solver/materialNonlinear2d.js web/src/core/model.js tests/arc-length-smoke.mjs tests/stability-bifurcation-smoke.mjs tests/multimode-stability-smoke.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add multimode stability tracking and branch probes"
          git push
