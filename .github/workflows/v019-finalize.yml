name: Finalize AstraStruct v0.19

on:
  push:
    branches: [feat/v019-multimode-branch-exploration]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize README and remove temporary implementation tooling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          t=t.replace('> **v0.18 experimental:** estabilidade tangente sobre Arc-Length/Riks, detecção espectral de singularidades, classificação de ponto-limite/bifurcação candidata e troca de ramo modal opcional.', '> **v0.19 experimental:** estabilidade tangente multimodal sobre Arc-Length/Riks, rastreamento por MAC, agrupamento de modos quase degenerados, exploração bilateral ±φ e troca de ramo modal opcional.', 1)
          t=t.replace('> **Estado atual — v0.18.0 experimental:**', '> **Estado atual — v0.19.0 experimental:**', 1)
          t=t.replace('**Arc-Length/Riks esférico v0.18, com raio adaptativo, cutback, continuidade de ramo e travessia de pontos-limite**', '**Arc-Length/Riks esférico v0.19, com raio adaptativo, cutback, continuidade de ramo e travessia de pontos-limite**', 1)
          t=t.replace('**estabilidade tangente v0.18, com autovalor crítico da parte simétrica escalada, classificação de ponto-limite/bifurcação candidata e semeadura modal experimental de ramo; para tangentes não simétricas o resultado é apenas candidato a singularidade não conservativa**', '**estabilidade tangente multimodal v0.19, com múltiplos autovalores críticos, rastreamento por MAC, agrupamento de subespaços quase degenerados, exploração local dos ramos +φ/−φ e semeadura modal experimental; para tangentes não simétricas o resultado permanece apenas candidato a singularidade não conservativa**', 1)
          marker='- **estabilidade tangente multimodal v0.19, com múltiplos autovalores críticos, rastreamento por MAC, agrupamento de subespaços quase degenerados, exploração local dos ramos +φ/−φ e semeadura modal experimental; para tangentes não simétricas o resultado permanece apenas candidato a singularidade não conservativa**;'
          if marker in t and 'docs/multimode-stability-v019.md' not in t:
              t=t.replace(marker, marker+'\n- documentação metodológica da estabilidade multimodal em `docs/multimode-stability-v019.md`;',1)
          p.write_text(t)
          PY
          rm -f .github/workflows/v019-core-validate.yml .github/workflows/v019-ui-validate.yml .github/workflows/v019-finalize.yml
          rm -f tools/v019_patch.py tools/v019_settings_patch.py tools/v019_ui_patch.py
      - name: Commit final v0.19 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize AstraStruct v0.19 multimode stability" || exit 0
          git push
