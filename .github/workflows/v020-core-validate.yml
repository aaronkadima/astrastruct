name: AstraStruct v0.20 distributed plasticity core

on:
  push:
    branches: [feat/v020-distributed-plasticity]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.20 core patch once
        run: |
          if grep -q "0.20.0-exp" web/src/solver/corotational2d.js; then
            echo 'v0.20 core already applied'
          else
            python tools/v020_core_patch.py
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate modules
        run: npm run check
      - name: Run structural regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit validated v0.20 core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/solver/distributedPlasticity2d.js web/src/solver/corotational2d.js web/src/core/model.js web/src/solver/materialNonlinear2d.js tests/distributed-plasticity-smoke.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add distributed steel fiber plasticity"
          git push
