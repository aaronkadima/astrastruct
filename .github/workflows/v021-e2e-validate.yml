name: AstraStruct v0.21 browser validation
on:
  push:
    branches: [feat/v021-cyclic-hysteresis]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run nonlinear browser regressions
        run: npx playwright test tests/e2e/cyclic-hysteresis.spec.ts tests/e2e/distributed-plasticity.spec.ts tests/e2e/stability-bifurcation.spec.ts tests/e2e/arc-length.spec.ts tests/e2e/pushover.spec.ts tests/e2e/material-nonlinear.spec.ts --project=chromium
