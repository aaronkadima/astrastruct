name: Finalize AstraStruct v0.21
on:
  push:
    branches: [feat/v021-cyclic-hysteresis]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize README and remove temporary tooling
        run: |
          python scripts/tmp_v021_finalize.py
          rm -f scripts/tmp_v021_core_patch.py scripts/tmp_v021_model_fix.py scripts/tmp_v021_ui_patch.py scripts/tmp_v021_finalize.py
          rm -f .github/workflows/v021-core-validate.yml .github/workflows/v021-ui-validate.yml .github/workflows/v021-e2e-validate.yml .github/workflows/v021-finalize.yml
      - name: Commit final v0.21 branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize AstraStruct v0.21 cyclic hysteresis"
            git push
          fi
