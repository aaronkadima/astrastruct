name: AstraStruct v0.22 cyclic concentrated hinges
on:
  push:
    branches: [feat/v022-cyclic-hinges-demand]
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply history-persistence fix once
        run: |
          if [ -f scripts/tmp_v022_history_fix.py ]; then python scripts/tmp_v022_history_fix.py; fi
      - run: npm install
      - run: npm run check
      - name: Run v0.22 benchmark
        run: node tests/cyclic-hinge-smoke.mjs
      - run: npm test
      - run: npm run build
      - name: Commit validated core
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add web/src/solver/materialNonlinear2d.js tests/cyclic-hinge-smoke.mjs
            git commit -m "fix: persist v0.22 cyclic hinge state across steps"
            git push
          fi
