name: AstraStruct v0.22 UI validation
on:
  push:
    branches: [feat/v022-cyclic-hinges-demand]
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.22 product patch once
        run: |
          python scripts/tmp_v022_ui_patch.py
          python scripts/tmp_v022_ui_regression_fix.py
      - run: npm install
      - run: npm run check
      - name: Run v0.22 concentrated-hinge benchmark
        run: node tests/cyclic-hinge-smoke.mjs
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run nonlinear desktop E2E
        run: npx playwright test tests/e2e/cyclic-hinge.spec.ts tests/e2e/cyclic-hysteresis.spec.ts tests/e2e/material-nonlinear.spec.ts tests/e2e/distributed-plasticity.spec.ts tests/e2e/pushover.spec.ts tests/e2e/arc-length.spec.ts tests/e2e/stability-bifurcation.spec.ts --project=desktop-chromium
      - name: Commit validated permanent v0.22 product changes
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/InspectorPanel.tsx app/src/AnalysisPanelV13.tsx app/src/NonlinearPostprocessPanel.tsx app/src/NonlinearReportPanel.tsx web/src/solver/corotational2d.js web/src/solver/materialNonlinear2d.js tests/e2e/cyclic-hinge.spec.ts tests/cyclic-hinge-smoke.mjs package.json README.md docs/cyclic-hinges-v022.md
            git commit -m "feat: complete AstraStruct v0.22 cyclic hinge product flow"
            git push
          fi
