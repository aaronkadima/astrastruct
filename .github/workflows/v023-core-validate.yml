name: AstraStruct v0.23 dynamics core
on:
  push:
    branches: [feat/v023-structural-dynamics]
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.23 core integration once
        run: |
          python scripts/tmp_v023_core_patch.py
          python scripts/tmp_v023_newmark_fix.py
      - run: npm install
      - run: npm run check
      - name: Run v0.23 dynamics benchmark
        run: node tests/dynamics-smoke.mjs
      - run: npm test
      - run: npm run build
      - name: Commit validated permanent core
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add web/src/core/model.js web/src/solver/index.js web/src/solver/dynamics2d.js tests/dynamics-smoke.mjs package.json
            git commit -m "feat: integrate AstraStruct v0.23 dynamics core"
            git push
          fi
