name: AstraStruct v0.24 seismic spectrum validation
on:
  push:
    branches: [feat/v024-seismic-spectrum]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.24 implementation
        run: |
          python scripts/tmp_v024_patch.py
          python - <<'PY'
          from pathlib import Path
          for name in ['app/src/AnalysisPanelV13.tsx','app/src/DynamicsPostprocessPanel.tsx']:
              p=Path(name);p.write_text(p.read_text().replace('\\"','"'))
          PY
      - run: npm install
      - name: Typecheck and module validation
        run: npm run check
      - name: v0.24 seismic benchmark
        run: node tests/seismic-spectrum-smoke.mjs
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated v0.24 permanent files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/core/model.js web/src/solver/dynamics2d.js web/src/solver/index.js app/src/AnalysisPanelV13.tsx app/src/App.tsx app/src/DynamicsPostprocessPanel.tsx tests/seismic-spectrum-smoke.mjs tests/e2e/seismic-spectrum.spec.ts tests/e2e/dynamics.spec.ts package.json README.md docs/seismic-spectrum-v024.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: add AstraStruct v0.24 seismic spectrum"
            git push
          fi
