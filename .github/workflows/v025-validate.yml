name: AstraStruct v0.25 ground-motion validation
on:
  push:
    branches: [feat/v025-ground-motion-processing]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.25 implementation
        run: |
          python scripts/tmp_v025_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('web/src/solver/dynamics2d.js')
          s=p.read_text()
          old="points=points.map((x,i)=>({t:x.t,accelG:values[i]*scaleFactor}));const processedStats=groundStats(points);"
          new="points=points.map((x,i)=>({t:x.t,accelG:values[i]*scaleFactor}));if(taperRatio>0&&points.length){points[0].accelG=0;points[points.length-1].accelG=0}const processedStats=groundStats(points);"
          if old not in s:
              raise SystemExit('v0.25 tapered endpoint anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Install dependencies
        run: npm install
      - name: Typecheck and module validation
        run: npm run check
      - name: v0.25 ground-motion benchmark
        run: node tests/ground-motion-v025-smoke.mjs
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated v0.25 permanent files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/core/model.js web/src/solver/dynamics2d.js web/src/solver/index.js app/src/AnalysisPanelV13.tsx app/src/DynamicsPostprocessPanel.tsx app/src/App.tsx tests/ground-motion-v025-smoke.mjs tests/e2e/ground-motion-v025.spec.ts tests/seismic-spectrum-smoke.mjs tests/dynamics-smoke.mjs tests/e2e/dynamics.spec.ts tests/e2e/seismic-spectrum.spec.ts package.json README.md docs/ground-motion-v025.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: add AstraStruct v0.25 ground-motion processing"
            git push
          fi
