name: v0251 architecture validation

on:
  push:
    branches: [feat/v0251-architecture-consolidation]
    paths:
      - scripts/tmp_v0251_patch.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0251-architecture-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply consolidation patch
        run: python3 scripts/tmp_v0251_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and module validation
        run: npm run check
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/core/model.js web/src/solver/index.js app/src/App.tsx package.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor: consolidate v0.25.1 architecture contracts"
          git push origin HEAD:feat/v0251-architecture-consolidation
