name: v026 spatial 3d validation

on:
  push:
    branches: [feat/v026-3d-structural-foundation]
    paths:
      - scripts/tmp_v026_patch.py
      - scripts/tmp_v026_fix.py
      - .github/workflows/v026-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v026-3d-structural-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.26 integration patch
        run: |
          python3 scripts/tmp_v026_patch.py
          python3 scripts/tmp_v026_fix.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and module validation
        run: npm run check
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json app/src/App.tsx docs/spatial3d-v026.md tests/spatial3d-integration-v026-smoke.mjs tests/e2e/spatial3d-v026.spec.ts web/src/core/version.js web/src/core/model.js web/src/core/elementRegistry.js web/src/core/solverRegistry.js web/src/solver/index.js web/src/solver/scenario.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate AstraStruct v0.26 spatial 3D foundation"
          git push origin HEAD:feat/v026-3d-structural-foundation
