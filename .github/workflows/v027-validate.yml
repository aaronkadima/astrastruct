name: v027 modal stability 3d validation

on:
  push:
    branches: [feat/v027-3d-modal-stability]
    paths:
      - scripts/tmp_v027_patch.py
      - .github/workflows/v027-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v027-3d-modal-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.27 integration patch
        run: python3 scripts/tmp_v027_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and module validation
        run: npm run check
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json app/src/App.tsx app/src/BucklingPanel.tsx app/src/DynamicsPostprocessPanel.tsx docs/modal-stability3d-v027.md tests/modal-stability3d-integration-v027-smoke.mjs tests/e2e/modal3d-v027.spec.ts web/src/core/version.js web/src/core/solverRegistry.js web/src/solver/index.js web/src/solver/modalStability3d.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate AstraStruct v0.27 modal and stability 3D"
          git push origin HEAD:feat/v027-3d-modal-stability
