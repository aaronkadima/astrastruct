name: v028 P-Delta 3D validation

on:
  push:
    branches: [feat/v028-pdelta3d]
    paths:
      - scripts/tmp_v028_patch.py
      - .github/workflows/v028-validate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v028-pdelta3d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.28 integration patch
        run: python3 scripts/tmp_v028_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and module validation
        run: npm run check
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E regression
        run: npx playwright test --project=desktop-chromium
      - name: Commit validated v0.28 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json web/src/core/version.js web/src/core/solverRegistry.js web/src/solver/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate AstraStruct v0.28 P-Delta 3D"
          git push origin HEAD:feat/v028-pdelta3d
