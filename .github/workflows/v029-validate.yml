name: v029 corotational 3D validation

on:
  push:
    branches: [feat/v029-corotational3d]
    paths:
      - web/src/solver/corotational3d.js
      - tests/corotational3d-v029-smoke.mjs
      - tests/spatial3d-integration-v026-smoke.mjs
      - scripts/tmp_v029_patch.py
      - .github/workflows/v029-validate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v029-corotational3d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v0.29 integration patch
        run: python3 scripts/tmp_v029_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and module validation
        run: npm run check
      - name: Full structural regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full responsive E2E regression
        run: npx playwright test
      - name: Commit validated v0.29 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json app/src/App.tsx app/src/styles.css web/src/core/version.js web/src/core/solverRegistry.js web/src/solver/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate AstraStruct v0.29 corotational 3D"
          git push origin HEAD:feat/v029-corotational3d
