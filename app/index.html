<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="description" content="AstraStruct — modelagem e análise estrutural" />
    <title>AstraStruct</title>
    <style>
      html,body,#root{margin:0;min-width:320px;min-height:100%;height:100%;background:#0b0f16;color:#eef4ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      body{min-height:100dvh}
      .boot-fallback{min-height:100dvh;display:grid;place-items:center;background:#0b0f16}
      .boot-card{width:min(420px,calc(100vw - 40px));padding:22px;border:1px solid #2a3648;border-radius:14px;background:#111822;text-align:center;box-sizing:border-box}
      .boot-mark{width:48px;height:48px;margin:0 auto 12px;display:grid;place-items:center;border-radius:12px;background:#163050;color:#9bc4ff;font-weight:900}
      .boot-card strong{display:block;font-size:16px}.boot-card small{display:block;margin-top:7px;color:#91a0b6}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-fallback"><div class="boot-card"><div class="boot-mark">AS</div><strong>Carregando AstraStruct</strong><small>Inicializando a interface de modelagem e análise estrutural…</small></div></div></div>
    <noscript><div style="padding:24px;background:#0b0f16;color:#eef4ff">O AstraStruct requer JavaScript habilitado.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
